# cargo-deny configuration. Run locally with `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2025-0052: async-std is discontinued (its maintainers point users
    # at smol, which it wrapped). This is an "unmaintained" advisory, not a
    # vulnerability — there is no known flaw to be exposed to.
    #
    # It reaches us only through the optional `runtime-async-std` feature, which
    # exists so callers already on async-std can use this crate; it is off by
    # default and nothing else depends on it. Removing the advisory means
    # dropping that adapter, which is a deprecation decision rather than a
    # security fix, so it is tracked separately rather than forced by CI.
    "RUSTSEC-2025-0052",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
