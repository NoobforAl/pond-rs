[package]
name = "pond-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An idiomatic, runtime-agnostic async + blocking worker pool for Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/NoobforAl/pond-rs"
homepage = "https://github.com/NoobforAl/pond-rs"
documentation = "https://docs.rs/pond-rs"
keywords = ["pool", "worker", "concurrency", "async", "tokio"]
categories = ["concurrency", "asynchronous"]
exclude = [".github/", "codecov.yml", "deny.toml"]

[lib]
name = "pond"

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["dep:tokio"]
runtime-smol = ["dep:async-global-executor", "dep:async-io"]
runtime-async-std = ["dep:async-std"]
blocking = ["dep:crossbeam-channel"]
metrics-export = []
# Heap profiling for the `mem_profile` example (via dhat); off by default.
dhat-heap = ["dep:dhat"]
# Live memory + span profiling in the Tracy GUI (for the `tracy_profile` example).
# Implies `tracing` so pond's spans show up in Tracy. Off by default. The Tracy
# client is used via `tracing_tracy::client` to avoid a duplicate-version clash.
tracy = ["tracing", "dep:tracing-tracy"]
tracing = ["dep:tracing"]
tokio-console = ["tracing", "dep:console-subscriber", "tokio?/tracing"]

[dependencies]
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }
async-channel = "2"
event-listener = "5"
pin-project-lite = "0.2"

tokio = { version = "1", default-features = false, features = [
    "rt",
    "time",
], optional = true }
async-global-executor = { version = "3", optional = true }
# Timer for the smol adapter's `Spawner::sleep`, so scheduled work doesn't spawn
# a blocking OS thread per sleep. Only pulled in by the `runtime-smol` feature.
async-io = { version = "2", optional = true }
async-std = { version = "1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "attributes",
], optional = true }
console-subscriber = { version = "0.5.0", optional = true }
# Heap profiler, enabled only by the `dhat-heap` feature (for `mem_profile`).
dhat = { version = "0.3", optional = true }
# Tracy profiler integration, enabled only by the `tracy` feature. The Tracy
# client comes via `tracing_tracy::client` (no separate tracy-client dep, so
# there's only one tracy-client-sys version).
tracing-tracy = { version = "0.11", optional = true }

[dev-dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
    "net",
    "io-util",
    "test-util",
] }
futures = { version = "0.3", features = ["executor"] }
criterion = "0.8.2"
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Tokio-only examples (they build the async pool via `Pool::builder()` and run on
# `#[tokio::main]`), so they are only compiled when the default tokio runtime is
# enabled. This keeps `cargo build/test --no-default-features --features
# runtime-smol` (or async-std) from trying to compile them.
[[example]]
name = "async_io"
required-features = ["runtime-tokio"]

[[example]]
name = "backpressure"
required-features = ["runtime-tokio"]

[[example]]
name = "cancel_deadline"
required-features = ["runtime-tokio"]

[[example]]
name = "config_channels"
required-features = ["runtime-tokio"]

[[example]]
name = "dynamic_resize"
required-features = ["runtime-tokio"]

[[example]]
name = "graceful_shutdown"
required-features = ["runtime-tokio"]

[[example]]
name = "http_requests"
required-features = ["runtime-tokio"]

[[example]]
name = "metrics"
required-features = ["runtime-tokio"]

[[example]]
name = "multi_tenant"
required-features = ["runtime-tokio"]

[[example]]
name = "panic_recovery"
required-features = ["runtime-tokio"]

[[example]]
name = "pool_context"
required-features = ["runtime-tokio"]

[[example]]
name = "result_task"
required-features = ["runtime-tokio"]

[[example]]
name = "scheduling"
required-features = ["runtime-tokio"]

[[example]]
name = "streaming_results"
required-features = ["runtime-tokio"]

[[example]]
name = "task_group"
required-features = ["runtime-tokio"]

[[example]]
name = "tracing_debug"
required-features = ["runtime-tokio"]

[[example]]
name = "blocking"
required-features = ["blocking"]

[[example]]
name = "metrics_export"
required-features = ["metrics-export", "runtime-tokio"]

[[example]]
name = "smol_runtime"
required-features = ["runtime-smol"]

[[example]]
name = "mem_profile"
required-features = ["dhat-heap", "runtime-tokio"]

[[example]]
name = "tracy_profile"
required-features = ["tracy", "runtime-tokio"]

# Benchmarks construct a Tokio runtime directly, so they require the tokio
# adapter (blocking-pool cases inside are additionally `#[cfg(feature =
# "blocking")]`).
[[bench]]
name = "pool_bench"
harness = false
required-features = ["runtime-tokio"]

[[bench]]
name = "workload_bench"
harness = false
required-features = ["runtime-tokio"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
features = ["runtime-tokio", "blocking", "tracing", "metrics-export"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
