[package]
name = "pond-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An idiomatic, runtime-agnostic async + blocking worker pool for Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/NoobforAl/pond-rs"
homepage = "https://github.com/NoobforAl/pond-rs"
documentation = "https://docs.rs/pond-rs"
keywords = ["pool", "worker", "concurrency", "async", "tokio"]
categories = ["concurrency", "asynchronous"]
exclude = [".github/", "codecov.yml", "deny.toml"]

[lib]
name = "pond"

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["dep:tokio"]
runtime-smol = ["dep:async-global-executor", "dep:async-io"]
runtime-async-std = ["dep:async-std"]
blocking = ["dep:crossbeam-channel"]

[dependencies]
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }
async-channel = "2"
# 5.4.2 fixes RUSTSEC-2026-0221 (`StackSlot` letting `!Send` tags cross threads).
event-listener = "5.4.2"
pin-project-lite = "0.2"

tokio = { version = "1", default-features = false, features = [
    "rt",
    "time",
], optional = true }
async-global-executor = { version = "3", optional = true }
# Timer for the smol adapter's `Spawner::sleep`, so scheduled work doesn't spawn
# a blocking OS thread per sleep. Only pulled in by the `runtime-smol` feature.
async-io = { version = "2", optional = true }
async-std = { version = "1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
# Test-only heap profiling: the `heap` integration test uses dhat's profiler to
# assert that sustained workloads don't grow live heap (leak regression). Never
# part of the shipped dependency graph.
dhat = "0.3"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
    "net",
    "io-util",
    "test-util",
] }
futures = { version = "0.3", features = ["executor"] }
criterion = "0.8.2"
proptest = "1"
# SQLite driver for the database-workload tests (`sqlite.rs`, `sqlite_load.rs`),
# which exercise the blocking pool against a real DB.
#
# Must stay a dev-dependency: `bundled` compiles SQLite from source into the
# test binaries, which is fine for tests but has no business in a consumer's
# build. Nothing in `src/` may reference it — `cargo tree -e normal` must show
# no rusqlite. `bundled` is deliberate over a system SQLite so the tests need no
# preinstalled library on any platform.
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Tokio-only examples (they build the async pool via `Pool::builder()` and run on
# `#[tokio::main]`), so they are only compiled when the default tokio runtime is
# enabled. This keeps `cargo build/test --no-default-features --features
# runtime-smol` (or async-std) from trying to compile them.
[[example]]
name = "async_io"
required-features = ["runtime-tokio"]

[[example]]
name = "backpressure"
required-features = ["runtime-tokio"]

[[example]]
name = "cancel_deadline"
required-features = ["runtime-tokio"]

[[example]]
name = "config_channels"
required-features = ["runtime-tokio"]

[[example]]
name = "dynamic_resize"
required-features = ["runtime-tokio"]

[[example]]
name = "graceful_shutdown"
required-features = ["runtime-tokio"]

[[example]]
name = "http_requests"
required-features = ["runtime-tokio"]

[[example]]
name = "multi_tenant"
required-features = ["runtime-tokio"]

[[example]]
name = "panic_recovery"
required-features = ["runtime-tokio"]

[[example]]
name = "pool_context"
required-features = ["runtime-tokio"]

[[example]]
name = "result_task"
required-features = ["runtime-tokio"]

[[example]]
name = "scheduling"
required-features = ["runtime-tokio"]

[[example]]
name = "streaming_results"
required-features = ["runtime-tokio"]

[[example]]
name = "task_group"
required-features = ["runtime-tokio"]

[[example]]
name = "blocking"
required-features = ["blocking"]

[[example]]
name = "smol_runtime"
required-features = ["runtime-smol"]

# Benchmarks construct a Tokio runtime directly, so they require the tokio
# adapter (blocking-pool cases inside are additionally `#[cfg(feature =
# "blocking")]`).
[[bench]]
name = "pool_bench"
harness = false
required-features = ["runtime-tokio"]

[[bench]]
name = "workload_bench"
harness = false
required-features = ["runtime-tokio"]

[[bench]]
name = "lifecycle_bench"
harness = false
required-features = ["runtime-tokio"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
features = ["runtime-tokio", "blocking"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
