name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # `tokio-console` requires `--cfg tokio_unstable`, so it cannot be part of
  # `--all-features`. The standard jobs use this safe set instead; a dedicated
  # step below compiles the tokio-console path with the unstable flag set.
  SAFE_FEATURES: "runtime-tokio,blocking,tracing"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --features "$SAFE_FEATURES" --verbose
      - name: Test (safe features)
        run: cargo test --features "$SAFE_FEATURES" --verbose
      - name: Test (no default features)
        run: cargo test --no-default-features --features runtime-tokio --verbose
      - name: Test (all runtimes + metrics-export)
        run: cargo test --features "runtime-tokio,runtime-smol,runtime-async-std,blocking,tracing,metrics-export" --verbose
      - name: Doctests
        run: cargo test --doc --features "$SAFE_FEATURES" --verbose

  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      # Build only: the library must compile on the declared MSRV. Tests pull in
      # dev-dependencies (criterion, etc.) whose own MSRV may be newer.
      - name: Build (safe features)
        run: cargo build --features "$SAFE_FEATURES" --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --features "$SAFE_FEATURES" -- -D warnings
      - name: benches (compile only)
        run: cargo bench --features "$SAFE_FEATURES" --no-run
      - name: tokio-console feature (compile only)
        run: cargo build --features tokio-console
        env:
          RUSTFLAGS: "--cfg tokio_unstable -D warnings"
      - name: docs
        run: cargo doc --no-deps --features "$SAFE_FEATURES"
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --features "$SAFE_FEATURES" --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
