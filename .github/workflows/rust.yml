name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SAFE_FEATURES: "runtime-tokio,blocking"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --features "$SAFE_FEATURES" --verbose
      - name: Test (safe features)
        run: cargo test --features "$SAFE_FEATURES" --verbose
      - name: Test (no default features)
        run: cargo test --no-default-features --features runtime-tokio --verbose
      - name: Test (all runtimes)
        run: cargo test --features "runtime-tokio,runtime-smol,runtime-async-std,blocking" --verbose
      # With tokio enabled, `Pool::builder()` binds to it, so only these runs
      # exercise the other adapters as the sole runtime.
      - name: Test (smol only)
        run: cargo test --no-default-features --features runtime-smol --verbose
      - name: Test (async-std only)
        run: cargo test --no-default-features --features runtime-async-std --verbose
      - name: Doctests
        run: cargo test --doc --features "$SAFE_FEATURES" --verbose

  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      # tokio 1.54 needs Rust 1.85, and this cargo can't pick an older release by
      # itself. Our `tokio = "1"` still allows 1.53, the newest that fits 1.75, so
      # users on 1.75 pin it the same way.
      - name: Pin dependencies to MSRV-compatible versions
        run: |
          cargo generate-lockfile
          cargo update -p tokio --precise 1.53.1
      # Build only: the library must compile on the declared MSRV. Tests pull in
      # dev-dependencies (criterion, etc.) whose own MSRV may be newer.
      - name: Build (safe features)
        run: cargo build --features "$SAFE_FEATURES" --verbose

  msrv-optional-runtimes:
    name: MSRV (1.85, optional runtimes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # These adapters depend on crates that need newer Rust than the crate's
      # `rust-version`, which covers the default features. See CONTRIBUTING.md.
      - name: Build (smol)
        run: cargo build --no-default-features --features runtime-smol --verbose
      - name: Build (async-std)
        run: cargo build --no-default-features --features runtime-async-std --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --features "$SAFE_FEATURES" -- -D warnings
      # The smol and async-std adapters are only compiled under their own
      # features, so the run above never lints them. Without this they can rot
      # unnoticed until someone enables the feature.
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: benches (compile only)
        run: cargo bench --features "$SAFE_FEATURES" --no-run
      - name: docs
        run: cargo doc --no-deps --features "$SAFE_FEATURES"
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: docs (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  deps:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rusqlite (which compiles SQLite from source via `bundled`), dhat,
      # criterion and proptest are test-only. If one ever drifts into
      # [dependencies], every consumer of pond-rs pays for it — a bundled C
      # library most of all. `-e normal` walks only the shipped edges, so
      # anything listed here appearing at all is the failure.
      - name: Dev-dependencies stay out of the shipped graph
        run: |
          cargo tree -e normal --all-features > shipped-tree.txt
          status=0
          for crate in rusqlite dhat criterion proptest tempfile; do
            if grep -qE "(^|[^[:alnum:]_-])$crate v" shipped-tree.txt; then
              echo "::error::$crate is a dev-dependency but reached the shipped dependency graph"
              status=1
            fi
          done
          exit $status
      # The published crate must build from exactly what gets packaged, with no
      # dev-dependencies in scope at all.
      - name: Package (dry run)
        run: cargo package --no-verify --allow-dirty

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --features "$SAFE_FEATURES" --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
