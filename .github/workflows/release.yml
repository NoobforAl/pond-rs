name: Release

# Deploy to the Rust package manager (crates.io) when a new version tag is
# pushed. This workflow never creates a tag itself — it only reacts to one that
# already exists. Publishing happens only after lints and tests pass.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SAFE_FEATURES: "runtime-tokio,blocking"

jobs:
  # Gate: lints + tests must pass before we publish anything.
  verify:
    name: Verify (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --features "$SAFE_FEATURES" -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Last line of defence before publishing: a test-only dependency that
      # drifted into [dependencies] would otherwise ship to every consumer.
      # rusqlite in particular compiles SQLite from source.
      - name: Dev-dependencies stay out of the shipped graph
        run: |
          cargo tree -e normal --all-features > shipped-tree.txt
          status=0
          for crate in rusqlite dhat criterion proptest tempfile; do
            if grep -qE "(^|[^[:alnum:]_-])$crate v" shipped-tree.txt; then
              echo "::error::$crate is a dev-dependency but reached the shipped dependency graph"
              status=1
            fi
          done
          exit $status
      - name: Test (safe features)
        run: cargo test --features "$SAFE_FEATURES" --verbose
      - name: Test (no default features)
        run: cargo test --no-default-features --features runtime-tokio --verbose

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Guard: the crate version in Cargo.toml must match the pushed tag
      # (e.g. tag `v0.1.0` -> version `0.1.0`). Prevents publishing a mismatch.
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VER="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          echo "tag=$TAG crate=$CRATE_VER"
          if [ "$TAG" != "$CRATE_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CRATE_VER"
            exit 1
          fi
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
